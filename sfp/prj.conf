# The SFP module emulation on LPI2C0 (A0h at 0x50, A2h at 0x51).
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
# The app wraps the LPI2C0 interrupt handler to see which address matched.
CONFIG_DYNAMIC_INTERRUPTS=y

# Module temperature from the on-board P3T1755 on I3C0.
CONFIG_SENSOR=y
CONFIG_I3C=y

CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_MAIN_STACK_SIZE=1536
